; Loaded by `composer dev` via PHP_INI_SCAN_DIR so local uploads match the app's limits
; (20MB per file, 10 files per sale — see StoreProjectSaleRequest). Production php.ini needs the same.
upload_max_filesize = 20M
post_max_size = 210M
max_file_uploads = 20
; GD needs ~4 bytes per pixel to re-compress large photos server-side.
memory_limit = 512M
